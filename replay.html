<!doctype html>
<meta charset="utf-8">
<title>Contract Negotiation — Replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f6f2; --panel:#ffffff; --ink:#1a1a1a; --muted:#6b6b64; --line:#e2e2da;
    --gov:#1f3a5f; --offa:#0f6b6b; --offb:#9a5b00;
    --ins:#0a7d33; --del:#b3261e; --hl:#fff7dd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .app{display:flex;flex-direction:column;height:100vh}
  header{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:8px 12px;cursor:pointer;color:var(--ink)}
  button:hover{background:#f0f0ea}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);min-width:104px}
  button:disabled{opacity:.4;cursor:default}
  .speed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .file{font-size:13px;color:var(--muted)}
  .file input{display:none}
  .file label{cursor:pointer;text-decoration:underline}
  .legend{display:flex;gap:10px;align-items:stretch;padding:10px 20px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap}
  .party{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .party .who{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .party ul{margin:6px 0 0;padding-left:18px}
  .party li{font-size:12.5px;color:#333;margin:2px 0}
  .party .hidden-obj{display:none}
  .party .hidden-obj .tag{color:var(--del);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  body.reveal .party .hidden-obj{display:block}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  main{flex:1;display:grid;grid-template-columns:1.15fr .85fr;gap:0;min-height:0}
  .doc,.trace{overflow:auto;padding:22px 26px;min-height:0}
  .doc{border-right:1px solid var(--line);background:#fbfbf8}
  .doc h2,.trace h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    margin:0 0 14px;font-weight:700}
  .doc-title{font-family:Georgia,'Times New Roman',serif;font-size:22px;margin:0 0 18px;font-weight:700}
  .clause{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.55;margin:0 0 16px;
    padding:8px 12px;border-left:3px solid transparent;border-radius:4px;transition:background .3s}
  .clause .h{font-weight:700;display:block;margin-bottom:2px}
  .clause.changed{background:var(--hl)}
  .clause.g-gov{border-left-color:var(--gov)} .clause.g-off_a{border-left-color:var(--offa)}
  .clause.g-off_b{border-left-color:var(--offb)}
  .clause.dim{opacity:.62}
  ins{background:rgba(10,125,51,.12);color:var(--ins);text-decoration:none;
    border-bottom:2px solid var(--ins);padding:0 1px}
  del{color:var(--del);text-decoration:line-through;opacity:.8;padding:0 1px}
  .ghost{opacity:.7}
  .entry{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin:0 0 12px;
    background:#fff;opacity:0;transform:translateY(6px);animation:rise .35s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .entry.gov{border-left-color:var(--gov)} .entry.off_a{border-left-color:var(--offa)}
  .entry.off_b{border-left-color:var(--offb)}
  .entry .name{font-weight:700;font-size:14px}
  .entry .role{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#fff;
    padding:2px 7px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .role.gov{background:var(--gov)} .role.off_a{background:var(--offa)} .role.off_b{background:var(--offb)}
  .entry .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:10px 0 3px;font-weight:700}
  .entry .reasoning{font-style:italic;color:#333;background:#f6f6ef;border-radius:6px;padding:8px 10px}
  .entry .says{font-size:15px}
  .entry .edit{font-size:12.5px;color:#444;margin:3px 0;padding-left:14px;position:relative}
  .entry .edit:before{content:"›";position:absolute;left:2px;color:var(--muted)}
  .entry .edit b{color:var(--ink)}
  .decision{margin-top:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .decision.counter{color:var(--gov)} .decision.award{color:var(--ins)}
  .award-banner{padding:14px 20px;background:var(--ink);color:#fff;text-align:center;font-size:16px;
    font-weight:600;display:none}
  .award-banner.show{display:block}
  .progress{height:4px;background:var(--line)}
  .progress .bar{height:100%;background:var(--ink);width:0;transition:width .3s}
  .placeholder{color:var(--muted);font-style:italic}
</style>

<div class="app">
  <header>
    <h1>AI Contract Negotiation <small id="sub">— replay</small></h1>
    <div class="controls">
      <span class="file"><label for="load">Load recording…</label><input id="load" type="file" accept="application/json"></span>
      <button id="restart" title="Restart">⏮</button>
      <button id="back" title="Step back">◀ Step</button>
      <button id="play" class="primary">▶ Play</button>
      <button id="fwd" title="Step forward">Step ▶</button>
      <span class="speed">Speed
        <input id="speed" type="range" min="0.5" max="3" step="0.5" value="1">
        <span id="speedval">1×</span>
      </span>
    </div>
  </header>

  <div class="legend" id="legend"></div>
  <div style="padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel)">
    <label class="toggle"><input type="checkbox" id="reveal"> Reveal hidden objectives</label>
  </div>

  <div class="award-banner" id="award"></div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <main>
    <section class="doc" id="doc"></section>
    <section class="trace" id="trace"><h2>Reasoning &amp; moves</h2>
      <div class="placeholder">Press Play to begin the negotiation.</div>
    </section>
  </main>
</div>

<script>
const COLORS = {gov:'--gov', off_a:'--offa', off_b:'--offb'};
let T = null, cur = -1, playing = false, timer = null;

function load(data){
  T = data; cur = -1; playing = false; clearTimeout(timer);
  document.getElementById('sub').textContent = '— ' + (T.scenario.title || 'replay');
  buildLegend();
  render();
}

function buildLegend(){
  const el = document.getElementById('legend'); el.innerHTML='';
  T.scenario.parties.forEach(p=>{
    const v = COLORS[p.id] || '--gov';
    const pub = (p.public_objectives||[]).map(o=>`<li>${esc(o)}</li>`).join('');
    const hid = (p.hidden_objectives||[]).map(o=>`<li>${esc(o)}</li>`).join('');
    el.insertAdjacentHTML('beforeend', `
      <div class="party">
        <div class="who"><span class="dot" style="background:var(${v})"></span>${esc(p.name)}</div>
        <ul>${pub}</ul>
        <div class="hidden-obj"><span class="tag">Hidden</span><ul>${hid}</ul></div>
      </div>`);
  });
}

// Apply edits for turns 0..t onto the initial clauses -> running document state.
function clausesAt(t){
  let cl = JSON.parse(JSON.stringify(T.scenario.initial_clauses));
  for(let i=0;i<=t;i++){
    for(const e of (T.turns[i].edits||[])){
      if(e.op==='replace'){ const c=cl.find(c=>c.id===e.clause_id); if(c) c.text=e.new; }
      else if(e.op==='delete'){ cl=cl.filter(c=>c.id!==e.clause_id); }
      else if(e.op==='insert_after'){
        const id=e.new_id||('n'+(cl.length+1));
        const nc={id,heading:e.heading||'New Clause',text:e.new};
        const idx=cl.findIndex(c=>c.id===e.clause_id);
        cl.splice(idx<0?cl.length:idx+1,0,nc);
      }
    }
  }
  return cl;
}

// Word-level LCS diff -> HTML with <del>/<ins>.
function wordDiff(a,b){
  const x=a.split(/(\s+)/), y=b.split(/(\s+)/);
  const n=x.length,m=y.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=x[i]===y[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out='';
  while(i<n&&j<m){
    if(x[i]===y[j]){out+=esc(x[i]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out+=x[i].trim()?`<del>${esc(x[i])}</del>`:esc(x[i]);i++;}
    else {out+=y[j].trim()?`<ins>${esc(y[j])}</ins>`:esc(y[j]);j++;}
  }
  while(i<n){out+=x[i].trim()?`<del>${esc(x[i])}</del>`:esc(x[i]);i++;}
  while(j<m){out+=y[j].trim()?`<ins>${esc(y[j])}</ins>`:esc(y[j]);j++;}
  return out;
}

function render(){
  renderDoc(); renderTrace(); renderControls();
  const pct = T.turns.length? Math.max(0,(cur+1))/T.turns.length*100 : 0;
  document.getElementById('bar').style.width = pct+'%';
  const aw = document.getElementById('award');
  if(cur===T.turns.length-1 && T.outcome){
    aw.className='award-banner show';
    aw.textContent='★ Contract awarded to '+(T.outcome.awarded_to_name||T.outcome.awarded_to);
  } else { aw.className='award-banner'; }
}

function renderDoc(){
  const doc=document.getElementById('doc');
  doc.innerHTML='<h2>Contract document</h2><div class="doc-title">'+
    esc(T.scenario.document_title||'Contract')+'</div>';
  const running = cur<0 ? JSON.parse(JSON.stringify(T.scenario.initial_clauses)) : clausesAt(cur);
  const turn = cur>=0 ? T.turns[cur] : null;
  const editMap={}; if(turn) for(const e of (turn.edits||[])) editMap[e.new_id||e.clause_id]=e;
  const grp = turn ? turn.actor : '';
  let firstChanged=null;
  running.forEach(c=>{
    const e=editMap[c.id];
    let body;
    if(e && e.op==='insert_after'){ body='<ins>'+esc(c.text)+'</ins>'; }
    else if(e && e.op==='replace'){ body=wordDiff(e.old||'', e.new||c.text); }
    else { body=esc(c.text); }
    const changed=!!e;
    const cls=['clause']; if(changed){cls.push('changed','g-'+grp);} else if(turn){cls.push('dim');}
    const id='cl-'+c.id;
    if(changed&&!firstChanged)firstChanged=id;
    doc.insertAdjacentHTML('beforeend',
      `<div class="${cls.join(' ')}" id="${id}"><span class="h">${esc(c.heading)}</span>${body}</div>`);
  });
  // Show deleted clauses this turn as struck ghosts.
  if(turn) for(const e of (turn.edits||[])) if(e.op==='delete'){
    doc.insertAdjacentHTML('beforeend',
      `<div class="clause changed g-${grp} ghost"><del>${esc(e.old||'(removed clause)')}</del></div>`);
  }
  if(firstChanged){const t=document.getElementById(firstChanged); if(t)t.scrollIntoView({block:'center',behavior:'smooth'});}
}

function renderTrace(){
  const tr=document.getElementById('trace');
  tr.innerHTML='<h2>Reasoning &amp; moves</h2>';
  if(cur<0){tr.insertAdjacentHTML('beforeend','<div class="placeholder">Press Play to begin the negotiation.</div>');return;}
  for(let i=0;i<=cur;i++){
    const t=T.turns[i];
    const edits=(t.edits||[]).map(e=>{
      const label = e.op==='insert_after'?'adds': e.op==='delete'?'removes':'revises';
      const target = e.op==='insert_after'? esc(e.heading||'clause') : esc(e.clause_id);
      return `<div class="edit"><b>${label} ${target}</b> — ${esc(e.rationale||'')}</div>`;
    }).join('');
    let dec='';
    if(t.decision&&t.decision.type){
      const txt=t.decision.type==='award'
        ? 'Decision: Award to '+esc(nameOf(t.decision.awarded_to))
        : 'Decision: Counter — continue negotiating';
      dec=`<div class="decision ${t.decision.type}">${txt}</div>`;
    }
    tr.insertAdjacentHTML('beforeend',`
      <div class="entry ${t.actor}">
        <div><span class="name">${esc(t.actor_name)}</span><span class="role ${t.actor}">${esc(t.role)}</span></div>
        <div class="label">Private reasoning</div>
        <div class="reasoning">${esc(t.reasoning)}</div>
        <div class="label">At the table</div>
        <div class="says">${esc(t.message)}</div>
        ${edits?`<div class="label">Redlines</div>${edits}`:''}
        ${dec}
      </div>`);
  }
  tr.scrollTop=tr.scrollHeight;
}

function nameOf(id){const p=T.scenario.parties.find(p=>p.id===id);return p?p.name:id;}
function renderControls(){
  document.getElementById('back').disabled = cur<0;
  document.getElementById('fwd').disabled = cur>=T.turns.length-1;
  document.getElementById('play').textContent = playing?'⏸ Pause':'▶ Play';
}

function step(d){
  clearTimeout(timer);
  cur=Math.max(-1,Math.min(T.turns.length-1,cur+d));
  render();
}
function play(){
  if(cur>=T.turns.length-1) cur=-1;
  playing=true; render(); tick();
}
function pause(){playing=false; clearTimeout(timer); render();}
function tick(){
  if(!playing) return;
  if(cur>=T.turns.length-1){playing=false; render(); return;}
  cur++; render();
  const speed=parseFloat(document.getElementById('speed').value);
  const words=(T.turns[cur].reasoning+' '+T.turns[cur].message).split(/\s+/).length;
  const dwell=Math.min(11000,Math.max(4200, words*90))/speed; // longer turns dwell longer
  timer=setTimeout(tick,dwell);
}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

document.getElementById('play').onclick=()=>playing?pause():play();
document.getElementById('fwd').onclick=()=>{pause();step(1);};
document.getElementById('back').onclick=()=>{pause();step(-1);};
document.getElementById('restart').onclick=()=>{pause();cur=-1;render();};
document.getElementById('reveal').onchange=e=>document.body.classList.toggle('reveal',e.target.checked);
document.getElementById('speed').oninput=e=>document.getElementById('speedval').textContent=e.target.value+'×';
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  else if(e.code==='ArrowRight'){pause();step(1);}
  else if(e.code==='ArrowLeft'){pause();step(-1);}
});
document.getElementById('load').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{load(JSON.parse(r.result));}catch(err){alert('Could not read transcript: '+err.message);}};
  r.readAsText(f);
};

// Boot with the embedded sample so it plays on open.
try{ load(JSON.parse(document.getElementById('embedded-transcript').textContent)); }
catch(e){ document.getElementById('doc').innerHTML='<p class="placeholder">Load a recording to begin.</p>'; }
</script>
