<!doctype html>
<meta charset="utf-8">
<title>Federal Source Selection & Contract Negotiation — Replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{

    --co:#1f3a5f; --program:#6b3fa0; --off1:#0f6b6b; --off2:#b3541e; --off3:#2f7a4f;
    --ins:#0a7d33; --del:#b3261e; --hl:#fff7dd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .app{display:flex;flex-direction:column;height:100vh}
  header{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:8px 12px;cursor:pointer;color:var(--ink)}
  button:hover{background:#f0f0ea}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);min-width:104px}
  button:disabled{opacity:.4;cursor:default}
  .speed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .file{font-size:13px;color:var(--muted)}
  .file input{display:none}
  .file label{cursor:pointer;text-decoration:underline}
  .legend{display:flex;gap:10px;align-items:flex-start;padding:10px 20px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;max-height:34vh;overflow:auto}
  .party{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
  .party .who{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
  .party .rolelabel{font-size:10.5px;color:var(--muted);margin:1px 0 0 18px;text-transform:uppercase;letter-spacing:.4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .party ul{margin:6px 0 0;padding-left:18px;display:none}
  .party li{font-size:12px;color:#333;margin:2px 0}
  .party .hidden-obj{display:none}
  .party .hidden-obj .tag{color:var(--del);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  body.objectives .party ul,body.reveal .party ul{display:block}
  body.reveal .party .hidden-obj{display:block}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .phasebar{display:flex;gap:6px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .phase-step{font-size:11.5px;padding:4px 10px;border-radius:20px;background:#f0f0ea;color:var(--muted);font-weight:600;white-space:nowrap}
  .phase-step.active{background:var(--ink);color:#fff}
  .phase-step.done{background:#e2e2da;color:#444}
  main{flex:1;display:grid;grid-template-columns:1.15fr .85fr;gap:0;min-height:0}
  .doc,.trace{overflow:auto;padding:22px 26px;min-height:0}
  .doc{border-right:1px solid var(--line);background:#fbfbf8}
  .doc h2,.trace h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    margin:0 0 14px;font-weight:700}
  .doc-title{font-family:Georgia,'Times New Roman',serif;font-size:22px;margin:0 0 18px;font-weight:700}
  .clause{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.55;margin:0 0 16px;
    padding:8px 12px;border-left:3px solid transparent;border-radius:4px;transition:background .3s}
  .clause .h{font-weight:700;display:block;margin-bottom:2px}
  .clause.changed{background:var(--hl)}
  .clause.g-co{border-left-color:var(--co)} .clause.g-program{border-left-color:var(--program)}
  .clause.g-off_1{border-left-color:var(--off1)} .clause.g-off_2{border-left-color:var(--off2)} .clause.g-off_3{border-left-color:var(--off3)}

  ins{background:rgba(10,125,51,.12);color:var(--ins);text-decoration:none;
    border-bottom:2px solid var(--ins);padding:0 1px}
  del{color:var(--del);text-decoration:line-through;opacity:.8;padding:0 1px}
  .ghost{opacity:.7}
  .status-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .status-card h3,.status-card h4{margin:14px 0 6px;font-size:14px}
  .status-card h3:first-child,.status-card h4:first-child{margin-top:0}
  .status-card p{margin:8px 0}
  .status-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .status-card ol{padding-left:20px;font-size:13.5px}
  .status-card ol li{margin:6px 0}
  .swgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
  .swgrid.compact{gap:10px;margin:4px 0 10px}
  .swgrid h4{margin:0 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
  .swgrid .strengths h4{color:var(--ins)}
  .swgrid .weaknesses h4{color:var(--del)}
  .swgrid ul{margin:2px 0 0;padding-left:16px;font-size:13px}
  .swgrid li{margin:2px 0}
  .factor-block{margin-bottom:12px}
  .factor-block h4{margin:0 0 4px;font-size:13.5px}
  .rank-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
  .rank-table td,.rank-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .badge.protest{background:var(--del);color:#fff}
  .badge.noprotest{background:var(--ins);color:#fff}
  .badge.award{background:var(--ink);color:#fff}
  .badge.internal{background:var(--muted);color:#fff}
  .entry{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;margin:0 0 12px;
    background:#fff;opacity:0;transform:translateY(6px);animation:rise .35s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .entry.co{border-left-color:var(--co)} .entry.program{border-left-color:var(--program)}
  .entry.off_1{border-left-color:var(--off1)} .entry.off_2{border-left-color:var(--off2)} .entry.off_3{border-left-color:var(--off3)}
  .entry.system{border-left-color:var(--muted)}
  .entry .name{font-weight:700;font-size:14px}
  .entry .role{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#fff;
    padding:2px 7px;border-radius:20px;margin-left:8px;vertical-align:middle}
  .role.co{background:var(--co)} .role.program{background:var(--program)}
  .role.off_1{background:var(--off1)} .role.off_2{background:var(--off2)} .role.off_3{background:var(--off3)}
  .role.system{background:var(--muted)}
  .entry .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:10px 0 3px;font-weight:700}
  .entry .reasoning{font-style:italic;color:#333;background:#f6f6ef;border-radius:6px;padding:8px 10px}
  .entry .says{font-size:15px}
  .entry .edit{font-size:12.5px;color:#444;margin:3px 0;padding-left:14px;position:relative}
  .entry .edit:before{content:"›";position:absolute;left:2px;color:var(--muted)}
  .entry .edit b{color:var(--ink)}
  .decision{margin-top:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .decision.counter{color:var(--co)} .decision.award{color:var(--ink)} .decision.execute{color:var(--ins)}
  .award-banner{padding:14px 20px;background:var(--ink);color:#fff;text-align:center;font-size:16px;
    font-weight:600;display:none}
  .award-banner.show{display:block}
  .progress{height:4px;background:var(--line)}
  .progress .bar{height:100%;background:var(--ink);width:0;transition:width .3s}
  .placeholder{color:var(--muted);font-style:italic}
</style>

<div class="app">
  <header>
    <h1>Federal Source Selection &amp; Contract Negotiation <small id="sub">— replay</small></h1>
    <div class="controls">
      <span class="file"><label for="load">Load recording…</label><input id="load" type="file" accept="application/json"></span>

  <div class="legend" id="legend"></div>
  <div style="padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:20px;flex-wrap:wrap">

  <div class="progress"><div class="bar" id="bar"></div></div>

  </main>
</div>

er-seat cap that would penalize government-wide adoption or scaling.\n\n6. Data Rights: Confirm the Government will receive, at minimum, government purpose rights in all Customer data, and a contractual right to full data export in a non-proprietary, machine-readable format at termination or expiration, at no additional cost.\n\n7. Cybersecurity/Incident Notification: Confirm your terms include a specific 72-hour cybersecurity incident notification obligation and explicit reference to FedRAMP and/or NIST SP 800-171 as the controlling security framework, rather than general commercial language.\n\n8. Data Protection Framework: Your compliance materials should reference the Privacy Act of 1974 and FISMA as applicable to agency data; if your current terms reference GDPR alone, please supplement with these federal requirements.\n\n9. Termination for Convenience: Confirm your contract terms include the Government's standard right to terminate for convenience.\n\n10. Standard Terms Check: Please affirmatively confirm that your proposed terms and conditions do not include open-ended indemnification obligations running against the Government, mandatory arbitration clauses, or a non-federal governing-law clause. If any such terms exist in your standard agreement, they must be revised to align with federal law (sovereign immunity, the Anti-Deficiency Act, and the Christian Doctrine) prior to award.\n\nPlease submit your Final Proposal Revision addressing each item above, with the confirmatory statements and revised clause language, if any, incorporated directly into your Volume documents.",

<script>
const COLORS = {co:'--co', program:'--program', off_1:'--off1', off_2:'--off2', off_3:'--off3'};
const ROLE_LABELS = {contracting_officer:'Contracting Officer', program_evaluator:'Program Evaluator', offeror:'Offeror', system:'System'};
const PHASE_GROUPS = [
  {label:'Proposals', phases:['proposal_submission']},
  {label:'Discussions', phases:['discussion_guidance','discussion','revision']},
  {label:'Evaluation', phases:['evaluation','recommendation']},
  {label:'Award Decision', phases:['award_decision']},
  {label:'Debrief & Protest', phases:['debrief','protest_decision']},
  {label:'Contract Negotiation', phases:['contract_negotiation','contract_final']}
];
const H2_BY_PHASE = {
  proposal_submission:'Proposal', discussion:'Discussion', revision:'Proposal Revision',
  contract_negotiation:'Contract Negotiation', contract_final:'Contract Negotiation'
};
let T = null, cur = -1, sub = 0, playing = false, timer = null;

// A "beat" is the smallest playback step. Beat 0 of a turn shows the actor's
// reasoning/message; each later beat reveals one more clause edit ("change by change").
function beatsFor(i){
  if(i<0 || !T || !T.turns[i]) return 1;
  const t = T.turns[i];
  const n = (t.edits||[]).length;
  return (t.doc && n>0) ? 1+n : 1;
}
function atFinalBeat(){
  return cur>=T.turns.length-1 && sub>=beatsFor(cur)-1;
}

function load(data){
  T = data; cur = -1; sub = 0; playing = false; clearTimeout(timer);
  document.getElementById('sub').textContent = '— ' + (T.scenario.title || 'replay');
  buildLegend();
  render();
}

function buildLegend(){
  const el = document.getElementById('legend'); el.innerHTML='';
  T.scenario.parties.forEach(p=>{
    const v = COLORS[p.id] || '--co';
    const pub = (p.public_objectives||[]).map(o=>`<li>${esc(o)}</li>`).join('');
    const hid = (p.hidden_objectives||[]).map(o=>`<li>${esc(o)}</li>`).join('');
    el.insertAdjacentHTML('beforeend', `
      <div class="party">
        <div class="who"><span class="dot" style="background:var(${v})"></span>${esc(p.name)}</div>
        <div class="rolelabel">${esc(ROLE_LABELS[p.role]||p.role)}</div>
        <ul>${pub}</ul>
        <div class="hidden-obj"><span class="tag">Hidden</span><ul>${hid}</ul></div>
      </div>`);
  });
}

function nameOf(id){
  if(id==='system') return 'System';
  const p = T.scenario.parties.find(p=>p.id===id);
  return p ? p.name : id;
}
function fmtPrice(n){ if(n===null||n===undefined) return '—'; return '$'+Number(n).toLocaleString()+'/yr'; }
function swList(arr){
  if(!arr || !arr.length) return '<div class="placeholder">none noted</div>';
  return '<ul>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
}

// -- generalized per-document clause state (proposal_off_1/2/3, or contract) --
function initialClauses(docId){
  const src = docId==='contract' ? T.scenario.contract_clause_template : T.scenario.proposal_clause_template;
  return JSON.parse(JSON.stringify(src));
}
function clausesAt(docId, uptoIndex, lastLimit){
  let cl = initialClauses(docId);
  for(let i=0;i<=uptoIndex;i++){
    const t = T.turns[i];
    if(t.doc !== docId) continue;
    let edits = t.edits||[];
    if(i===uptoIndex && lastLimit!=null) edits = edits.slice(0, lastLimit);
    for(const e of edits){
      if(e.op==='replace'){ const c=cl.find(c=>c.id===e.clause_id); if(c) c.text=e.new; }
      else if(e.op==='delete'){ cl=cl.filter(c=>c.id!==e.clause_id); }
      else if(e.op==='insert_after'){
        const id=e.new_id||('n'+(cl.length+1));
        const nc={id,heading:e.heading||'New Clause',text:e.new};
        const idx=cl.findIndex(c=>c.id===e.clause_id);
        cl.splice(idx<0?cl.length:idx+1,0,nc);
      }
    }
  }
  return cl;
}
function docTitle(docId){
  if(docId==='contract') return 'Final Contract — Commercial Terms of Service';
  const oid = docId.replace('proposal_','');
  return nameOf(oid) + ' — Proposal (Volumes I–IV)';
}

// Word-level LCS diff -> HTML with <del>/<ins>.
function wordDiff(a,b){
  const x=a.split(/(\s+)/), y=b.split(/(\s+)/);
  const n=x.length,m=y.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=x[i]===y[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out='';
  while(i<n&&j<m){
    if(x[i]===y[j]){out+=esc(x[i]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out+=x[i].trim()?`<del>${esc(x[i])}</del>`:esc(x[i]);i++;}
    else {out+=y[j].trim()?`<ins>${esc(y[j])}</ins>`:esc(y[j]);j++;}
  }
  while(i<n){out+=x[i].trim()?`<del>${esc(x[i])}</del>`:esc(x[i]);i++;}
  while(j<m){out+=y[j].trim()?`<ins>${esc(y[j])}</ins>`:esc(y[j]);j++;}
  return out;
}

function render(){
  renderPhaseBar(); renderDoc(); renderTrace(); renderControls();
  let done=0, total=0;
  for(let i=0;i<T.turns.length;i++){
    const b=beatsFor(i); total+=b;
    if(i<cur) done+=b; else if(i===cur) done+=sub+1;
  }
  const pct = total ? done/total*100 : 0;
  document.getElementById('bar').style.width = pct+'%';
  const aw = document.getElementById('award');
  const lastTurn = T.turns.length ? T.turns[T.turns.length-1] : null;
  if(atFinalBeat() && T.outcome && T.outcome.executed && lastTurn && lastTurn.decision && lastTurn.decision.type==='execute'){
    aw.className='award-banner show';
    aw.textContent='★ Contract executed with '+(T.outcome.awarded_to_name||T.outcome.awarded_to);
  } else { aw.className='award-banner'; }
}

function renderPhaseBar(){
  const el = document.getElementById('phasebar');
  const activeIdx = cur<0 ? -1 : PHASE_GROUPS.findIndex(g=>g.phases.includes(T.turns[cur].phase));
  el.innerHTML = PHASE_GROUPS.map((g,i)=>{
    const cls = i<activeIdx ? 'done' : i===activeIdx ? 'active' : '';
    return `<div class="phase-step ${cls}">${i+1}. ${esc(g.label)}</div>`;
  }).join('');
}

function introCard(){
  const s = T.scenario.solicitation;
  if(!s) return '<p class="placeholder">Press Play to begin.</p>';
  const factors = (s.section_M.factors||[]).map(f=>`<li><b>${esc(f.name)}</b> — ${esc(f.description)}</li>`).join('');
  return `<h2>Solicitation</h2>
    <div class="doc-title">${esc(T.scenario.document_title||T.scenario.title)}</div>
    <div class="status-card">
      <div class="sub">${esc(s.number)} — ${esc(s.agency)}</div>
      <p>${esc(s.requirement_summary)}</p>
      <p><b>Contract type:</b> ${esc(s.contract_type)}</p>
      <p><b>Period of performance:</b> ${esc(s.period_of_performance)}</p>
      <h3>Section M — Basis of Award</h3>
      <p>${esc(s.section_M.basis_of_award)}</p>
      <ol>${factors}</ol>
    </div>`;
}

function guidanceCard(t){
  const items = (t.payload.guidance||[]).map(g=>`<li><b>${esc(nameOf(g.offeror))}:</b> ${esc(g.note)}</li>`).join('');
  return `<h2>Discussions</h2><div class="doc-title">Technical Guidance to the Contracting Officer</div>
    <div class="status-card"><span class="badge internal">Internal — never shared with offerors</span>
    <ul style="margin-top:12px">${items}</ul></div>`;
}
function evaluationCard(t){
  const p = t.payload||{}; const factors = p.factors||{};
  const order=[['technical','Factor 1 — Technical Approach'],['management','Factor 2 — Management Approach'],['past_performance','Factor 3 — Past Performance']];
  const blocks = order.map(([k,label])=>{
    const f = factors[k]||{strengths:[],weaknesses:[]};
    return `<div class="factor-block"><h4>${esc(label)}</h4>
      <div class="swgrid">
        <div class="strengths"><h4>Strengths</h4>${swList(f.strengths)}</div>
        <div class="weaknesses"><h4>Weaknesses</h4>${swList(f.weaknesses)}</div>
      </div></div>`;
  }).join('');
  return `<h2>Evaluation</h2><div class="doc-title">Technical Evaluation — ${esc(nameOf(p.offeror))}</div>
    <div class="status-card">${blocks}<p>${esc(p.overall||'')}</p></div>`;
}
function recommendationCard(t){
  const p = t.payload||{};
  const rows = (p.ranking||[]).map((oid,i)=>`<tr><td>${i+1}</td><td>${esc(nameOf(oid))}${oid===p.recommended?' <span class="badge award">Recommended</span>':''}</td></tr>`).join('');
  return `<h2>Evaluation</h2><div class="doc-title">Program Office Recommendation</div>
    <div class="status-card"><table class="rank-table"><tr><th>Rank</th><th>Offeror</th></tr>${rows}</table>
    <p style="margin-top:12px">${esc(p.rationale||'')}</p></div>`;
}
function awardCard(t){
  const p = t.payload||{}; const pc = p.price_comparison||{};
  const rows = Object.keys(pc).map(oid=>`<tr><td>${esc(nameOf(oid))}</td><td>${fmtPrice(pc[oid])}</td></tr>`).join('');
  const awardedTo = t.decision && t.decision.awarded_to;
  return `<h2>Award Decision</h2><div class="doc-title">Best-Value Tradeoff</div>
    <div class="status-card"><table class="rank-table"><tr><th>Offeror</th><th>Price</th></tr>${rows}</table>
    <p style="margin-top:12px">${esc(p.tradeoff_rationale||'')}</p>
    ${awardedTo?`<p><span class="badge award">Selected for Award: ${esc(nameOf(awardedTo))}</span></p>`:''}
    </div>`;
}
function debriefCard(t){
  const p = t.payload||{};
  return `<h2>Debrief</h2><div class="doc-title">Debrief — ${esc(nameOf(p.offeror))}</div>
    <div class="status-card"><p>${esc(p.note||'')}</p>
    <div class="swgrid"><div class="strengths"><h4>Strengths</h4>${swList(p.strengths)}</div>
    <div class="weaknesses"><h4>Weaknesses</h4>${swList(p.weaknesses)}</div></div></div>`;
}
function protestCard(t){
  const p = t.payload||{};
  const badge = p.protest ? '<span class="badge protest">Protest Filed</span>' : '<span class="badge noprotest">No Protest</span>';
  return `<h2>Debrief</h2><div class="doc-title">${esc(t.actor_name)} — Protest Decision</div>
    <div class="status-card">${badge}${p.grounds?`<p style="margin-top:12px">${esc(p.grounds)}</p>`:''}</div>`;
}
function phaseCard(t){
  switch(t.phase){
    case 'discussion_guidance': return guidanceCard(t);
    case 'evaluation': return evaluationCard(t);
    case 'recommendation': return recommendationCard(t);
    case 'award_decision': return awardCard(t);
    case 'debrief': return debriefCard(t);
    case 'protest_decision': return protestCard(t);
    default: return '<p class="placeholder">—</p>';
  }
}

function renderDoc(){
  const doc = document.getElementById('doc');
  if(cur<0){ doc.innerHTML = introCard(); return; }
  const t = T.turns[cur];
  if(t.doc){
    const h2 = H2_BY_PHASE[t.phase] || 'Document';
    doc.innerHTML = `<h2>${esc(h2)}</h2><div class="doc-title">${esc(docTitle(t.doc))}</div>`;
    // Reveal only the clause edits that have played so far this turn.
    const revealed = (t.edits||[]).slice(0, sub);
    const running = clausesAt(t.doc, cur, sub);
    const editMap = {}; for(const e of revealed) editMap[e.new_id||e.clause_id]=e;
    const grp = t.actor;
    let lastChanged=null;
    running.forEach(c=>{
      const e = editMap[c.id];
      let body;
      if(e && e.op==='insert_after'){ body='<ins>'+esc(c.text)+'</ins>'; }
      else if(e && e.op==='replace'){ body=wordDiff(e.old||'', e.new||c.text); }
      else { body=esc(c.text); }
      const changed = !!e;
      const cls=['clause']; if(changed){cls.push('changed','g-'+grp);} else {cls.push('dim');}
      const id = 'cl-'+t.doc+'-'+c.id;
      if(changed) lastChanged = id;
      doc.insertAdjacentHTML('beforeend',
        `<div class="${cls.join(' ')}" id="${id}"><span class="h">${esc(c.heading)}</span>${body}</div>`);
    });
    for(const e of revealed) if(e.op==='delete'){
      doc.insertAdjacentHTML('beforeend',
        `<div class="clause changed g-${grp} ghost"><del>${esc(e.old||'(removed clause)')}</del></div>`);
    }
    if(lastChanged){const el=document.getElementById(lastChanged); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});}
  } else {
    doc.innerHTML = phaseCard(t);
  }
}

function entryPayloadHtml(t){
  const p = t.payload;
  if(!p) return '';
  switch(t.phase){
    case 'discussion_guidance': {
      const items = (p.guidance||[]).map(g=>`<div class="edit"><b>${esc(nameOf(g.offeror))}</b> — ${esc(g.note)}</div>`).join('');
      return `<div class="label">Guidance (internal)</div>${items}`;
    }
    case 'evaluation': {
      const order=[['technical','Technical'],['management','Management'],['past_performance','Past Performance']];
      const f = p.factors||{};
      return order.map(([k,label])=>{
        const fac = f[k]||{strengths:[],weaknesses:[]};
        return `<div class="label">${label}</div><div class="swgrid compact">
          <div class="strengths">${swList(fac.strengths)}</div>
          <div class="weaknesses">${swList(fac.weaknesses)}</div></div>`;
      }).join('');
    }
    case 'recommendation': {
      const rank = (p.ranking||[]).map((oid,i)=>`${i+1}. ${esc(nameOf(oid))}`).join(' &nbsp;·&nbsp; ');
      return `<div class="label">Ranking</div><div>${rank}</div>`;
    }
    case 'award_decision': {
      const pc = p.price_comparison||{};
      const rows = Object.keys(pc).map(oid=>`<div class="edit"><b>${esc(nameOf(oid))}</b> — ${fmtPrice(pc[oid])}</div>`).join('');
      return `<div class="label">Price comparison</div>${rows}`;
    }
    case 'debrief': {
      return `<div class="swgrid compact"><div class="strengths">${swList(p.strengths)}</div><div class="weaknesses">${swList(p.weaknesses)}</div></div>`;
    }
    case 'protest_decision': {
      const badge = p.protest ? '<span class="badge protest">Protest Filed</span>' : '<span class="badge noprotest">No Protest</span>';
      return `<div class="label">Decision</div>${badge}`;
    }
    default: return '';
  }
}

function renderTrace(){
  const tr=document.getElementById('trace');
  tr.innerHTML='<h2>Reasoning &amp; moves</h2>';
  if(cur<0){tr.insertAdjacentHTML('beforeend','<div class="placeholder">Press Play to begin.</div>');return;}
  for(let i=0;i<=cur;i++){
    const t=T.turns[i];
    const isCur = i===cur;
    const lastBeat = !isCur || sub>=beatsFor(i)-1;
    let editArr = t.edits||[];
    if(isCur && t.doc) editArr = editArr.slice(0, sub);
    const edits=editArr.map(e=>{
      const label = e.op==='insert_after'?'adds': e.op==='delete'?'removes':'revises';
      const target = e.op==='insert_after'? esc(e.heading||'clause') : esc(e.clause_id);
      return `<div class="edit"><b>${label} ${target}</b> — ${esc(e.rationale||'')}</div>`;
    }).join('');
    let dec='';
    if(lastBeat && t.decision && t.decision.type){
      const txt = t.decision.type==='award' ? 'Decision: Selected for award — '+esc(nameOf(t.decision.awarded_to))
        : t.decision.type==='execute' ? 'Decision: Execute — contract signed'
        : 'Decision: Counter — continue negotiating';
      dec = `<div class="decision ${t.decision.type}">${txt}</div>`;
    }
    tr.insertAdjacentHTML('beforeend',`
      <div class="entry ${t.actor}">
        <div><span class="name">${esc(t.actor_name)}</span><span class="role ${t.actor}">${esc(t.role)}</span></div>
        ${t.reasoning?`<div class="label">Private reasoning</div><div class="reasoning">${esc(t.reasoning)}</div>`:''}
        ${t.message?`<div class="label">At the table</div><div class="says">${esc(t.message)}</div>`:''}
        ${edits?`<div class="label">Changes</div>${edits}`:''}
        ${lastBeat?entryPayloadHtml(t):''}
        ${dec}
      </div>`);
  }
  tr.scrollTop=tr.scrollHeight;
}

function renderControls(){
  document.getElementById('back').disabled = cur<0;
  document.getElementById('fwd').disabled = atFinalBeat();
  document.getElementById('play').textContent = playing?'⏸ Pause':'▶ Play';
}

// Move one beat forward (d>0) or back (d<0).
function step(d){
  clearTimeout(timer);
  if(d>0){
    if(cur<0){ cur=0; sub=0; }
    else if(sub < beatsFor(cur)-1){ sub++; }
    else if(cur < T.turns.length-1){ cur++; sub=0; }
  } else if(d<0){
    if(cur<0){ /* already at start */ }
    else if(sub>0){ sub--; }
    else if(cur>0){ cur--; sub=beatsFor(cur)-1; }
    else { cur=-1; sub=0; }
  }
  render();
}
function play(){
  if(atFinalBeat()){ cur=-1; sub=0; }
  playing=true; render(); tick();
}
function pause(){playing=false; clearTimeout(timer); render();}
function tick(){
  if(!playing) return;
  if(atFinalBeat()){ playing=false; render(); return; }
  step(1); // advance one beat (also re-renders)
  const speed=parseFloat(document.getElementById('speed').value);
  const t=T.turns[cur];
  let ms;
  if(sub===0){ // beat 0: reading the actor's reasoning + statement
    const words=((t.reasoning||'')+' '+(t.message||'')).split(/\s+/).length;
    ms=Math.min(14000, Math.max(4000, words*85));
  } else { // a single clause change landing
    const e=(t.edits||[])[sub-1]||{};
    const words=((e.new||e.old||'')+' '+(e.rationale||'')).split(/\s+/).length;
    ms=Math.min(11000, Math.max(3000, words*45));
  }
  timer=setTimeout(tick, ms/speed);
}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

document.getElementById('play').onclick=()=>playing?pause():play();
document.getElementById('fwd').onclick=()=>{pause();step(1);};
document.getElementById('back').onclick=()=>{pause();step(-1);};
document.getElementById('restart').onclick=()=>{pause();cur=-1;sub=0;render();};
document.getElementById('reveal').onchange=e=>document.body.classList.toggle('reveal',e.target.checked);
document.getElementById('showobj').onchange=e=>document.body.classList.toggle('objectives',e.target.checked);
document.getElementById('speed').oninput=e=>document.getElementById('speedval').textContent=e.target.value+'×';
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  else if(e.code==='ArrowRight'){pause();step(1);}
  else if(e.code==='ArrowLeft'){pause();step(-1);}
});
document.getElementById('load').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{load(JSON.parse(r.result));}catch(err){alert('Could not read transcript: '+err.message);}};
  r.readAsText(f);
};

// Boot with the embedded sample so it plays on open.
try{ load(JSON.parse(document.getElementById('embedded-transcript').textContent)); }
catch(e){ document.getElementById('doc').innerHTML='<p class="placeholder">Load a recording to begin.</p>'; }
</script>
